name: Weekly Federal Signals

on:
  workflow_dispatch:
  schedule:
    # The time guard below chooses the correct trigger across U.S. daylight-saving changes.
    - cron: "0 12 * * 1"
    - cron: "0 13 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-federal-signals
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check the Eastern-time schedule gate
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_ENABLED: ${{ vars.WEEKLY_SIGNALS_SCHEDULE_ENABLED }}
        run: |
          node <<'NODE'
          const parts = Object.fromEntries(
            new Intl.DateTimeFormat("en-US", {
              timeZone: "America/New_York",
              weekday: "short",
              hour: "2-digit",
              hourCycle: "h23",
            }).formatToParts(new Date()).map(({ type, value }) => [type, value]),
          );
          const manual = process.env.EVENT_NAME === "workflow_dispatch";
          const scheduled = process.env.SCHEDULE_ENABLED === "true" && parts.weekday === "Mon" && parts.hour === "08";
          const shouldRun = manual || scheduled;
          require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `run=${shouldRun}\n`);
          console.log(shouldRun ? "Weekly refresh enabled." : "Skipped: schedule is disabled or this is the DST shadow trigger.");
          NODE

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Refresh source signals
        if: steps.gate.outputs.run == 'true'
        env:
          WEEKLY_SIGNALS_SUMMARY_PATH: ${{ runner.temp }}/weekly-signals-summary.md
        run: |
          set -o pipefail
          npm run signals:refresh 2>&1 | tee "${RUNNER_TEMP}/weekly-signals.log"

      - name: Verify generated data and application
        if: steps.gate.outputs.run == 'true'
        run: |
          set -o pipefail
          {
            npm run signals:validate
            npm test
            npm run lint
            npm run build
          } 2>&1 | tee -a "${RUNNER_TEMP}/weekly-signals.log"

      - name: Detect generated changes
        id: changes
        if: steps.gate.outputs.run == 'true'
        run: |
          if git diff --quiet -- src/data/generated; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the review branch
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "federal-signal[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C automation/weekly-signals
          git add src/data/generated
          git commit -m "data: refresh weekly federal signals"
          git push --force origin automation/weekly-signals

          pr_number="$(gh pr list --base main --head automation/weekly-signals --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "Weekly federal signal refresh" --body-file "${RUNNER_TEMP}/weekly-signals-summary.md"
          else
            gh pr create --base main --head automation/weekly-signals --title "Weekly federal signal refresh" --body-file "${RUNNER_TEMP}/weekly-signals-summary.md"
          fi

      - name: Close a stale automation pull request
        if: steps.changes.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="$(gh pr list --base main --head automation/weekly-signals --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr_number" ]; then
            gh pr close "$pr_number" --comment "The latest scan matches main; closing the stale review queue."
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/automation/weekly-signals" || true
          fi

      - name: Retain failure diagnostics for seven days
        if: failure() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-signal-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/weekly-signals.log
          if-no-files-found: ignore
          retention-days: 7
